name: Build signed Jvy Wallet APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jvy-wallet-apk-version
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the version baseline
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "The default branch changed. Start a new build from its latest revision."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build the numbered release APK
        shell: pwsh
        env:
          JVY_SIGNING_STORE_BASE64: ${{ secrets.JVY_SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JVY_SIGNING_STORE_BASE64)) {
            throw "Configure the JVY_SIGNING_STORE_BASE64 Actions secret."
          }
          $privateDir = & mktemp -d "$env:RUNNER_TEMP/jvy-signing.XXXXXXXX"
          if ($LASTEXITCODE -ne 0) { throw "Could not create a private signing directory." }
          try {
            $env:SIGNING_STORE_FILE = Join-Path $privateDir "release.jks"
            New-Item -ItemType File -Path $env:SIGNING_STORE_FILE | Out-Null
            & chmod 600 $env:SIGNING_STORE_FILE
            if ($LASTEXITCODE -ne 0) { throw "Could not restrict access to the temporary keystore." }
            [IO.File]::WriteAllBytes($env:SIGNING_STORE_FILE, [Convert]::FromBase64String($env:JVY_SIGNING_STORE_BASE64))
            Remove-Item Env:JVY_SIGNING_STORE_BASE64
            ./scripts/build-jvy-apk.ps1 -Variant release -Bump patch
          } finally {
            Remove-Item -LiteralPath $privateDir -Recurse -Force
          }

      - name: Verify the APK and record the version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^versionName=//p' version.properties)
          code=$(sed -n 's/^versionCode=//p' version.properties)
          name="Jvy_wallet_v$version"
          apk="artifacts/apk/$name.apk"
          manifest="artifacts/apk/$name.json"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          badging=$("$tools/aapt" dump badging "$apk")
          [[ "$badging" == "package: name='com.ivy.wallet' versionCode='$code' versionName='$version'"* ]]
          checksum=$(jq -er '.sha256' "$manifest")
          printf '%s  %s\n' "${checksum,,}" "$apk" | sha256sum --check

          git config --local user.name 'Joravar Singh'
          git config --local user.email 'joravarsinghing@users.noreply.github.com'
          git config --local --get user.name
          git config --local --get user.email
          git add -- version.properties
          git commit -m "Record Jvy Wallet APK v$version"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
          printf '### %s.apk\n\nVersion code %s\n\nSHA-256 `%s`\n' "$name" "$code" "$checksum" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the APK and manifest to this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            artifacts/apk/${{ steps.apk.outputs.name }}.apk
            artifacts/apk/${{ steps.apk.outputs.name }}.json
          if-no-files-found: error
